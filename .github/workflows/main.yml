name: Update and Deploy Price Data

on:
  schedule:
    - cron: "0 12 * * *" # Runs every day at 12:00 PM UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mask provider URL fragments
        env:
          ENERGY_PROVIDER_URL: ${{ secrets.ENERGY_PROVIDER_URL }}
        run: |
          rest="${ENERGY_PROVIDER_URL#*://}"
          host="${rest%%/*}"
          host="${host%%:*}"
          path="${rest#"$host"}"
          path="${path#:*/}"
          path="${path#/}"
          for fragment in "$host" "${host#www.}" "$path"; do
            if [ "${#fragment}" -gt 2 ]; then echo "::add-mask::$fragment"; fi
          done

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Generate price data
        env:
          ENERGY_PROVIDER_URL: ${{ secrets.ENERGY_PROVIDER_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
